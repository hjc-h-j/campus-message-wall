<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>校园交流留言墙平台系统总体架构图</title>
<style>
  body{background:#fff;margin:0;padding:36px 16px;}
  .chart{display:flex;justify-content:center;margin:0 0 48px;}
  svg{display:block;background:#fff;}
  .box{fill:#fff;stroke:#000;stroke-width:1.3;}
  .layer{fill:#fff;stroke:#000;stroke-width:1.6;}
  .t{font:10.5pt "Times New Roman","SimSun",serif;fill:#000;text-anchor:middle;dominant-baseline:central;}
  .lbl{font:10.5pt "Times New Roman","SimSun",serif;fill:#000;}
  .ln{stroke:#000;stroke-width:1.3;fill:none;marker-end:url(#ar);}
  .lnp{stroke:#000;stroke-width:1.3;fill:none;}
</style>
</head>
<body>
<div class="chart">
<svg width="960" height="700" viewBox="0 0 960 700">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#000"/>
    </marker>
  </defs>

  <!-- 顶部：校园用户 -->
  <rect class="box" x="330" y="16" width="300" height="40"/>
  <text class="t" x="480" y="37">校园用户（浏览器 / 移动浏览器）</text>
  <line class="ln" x1="480" y1="56" x2="480" y2="78"/>

  <!-- 表示层 -->
  <rect class="layer" x="60" y="80" width="840" height="148"/>
  <text class="lbl" x="78" y="104">表示层（Vue3 单页应用）</text>
  <rect class="box" x="80"  y="118" width="185" height="76"/>
  <text class="t" x="172" y="146">页面组件</text>
  <text class="t" x="172" y="170">留言墙 / 照片墙 / 详情</text>
  <rect class="box" x="285" y="118" width="185" height="76"/>
  <text class="t" x="377" y="146">Vue Router</text>
  <text class="t" x="377" y="170">路由与登录守卫</text>
  <rect class="box" x="490" y="118" width="185" height="76"/>
  <text class="t" x="582" y="146">Vuex 状态管理</text>
  <text class="t" x="582" y="170">用户身份 / 标签缓存</text>
  <rect class="box" x="695" y="118" width="185" height="76"/>
  <text class="t" x="787" y="146">Axios 请求封装</text>
  <text class="t" x="787" y="170">统一拦截与错误提示</text>

  <line class="ln" x1="480" y1="228" x2="480" y2="256"/>
  <text class="lbl" x="494" y="245">HTTP / JSON</text>

  <!-- 接口层 -->
  <rect class="layer" x="60" y="258" width="840" height="128"/>
  <text class="lbl" x="78" y="282">接口层（Node.js + Express）</text>
  <rect class="box" x="80" y="296" width="253" height="76"/>
  <text class="t" x="206" y="324">RESTful 路由</text>
  <text class="t" x="206" y="348">routes/index.js</text>
  <rect class="box" x="353" y="296" width="253" height="76"/>
  <text class="t" x="479" y="324">中间件</text>
  <text class="t" x="479" y="348">tokenVerify / adminAuth / CORS</text>
  <rect class="box" x="626" y="296" width="253" height="76"/>
  <text class="t" x="752" y="324">静态资源服务</text>
  <text class="t" x="752" y="348">上传图片 / 前端构建产物</text>

  <line class="ln" x1="480" y1="386" x2="480" y2="414"/>

  <!-- 业务与数据访问层 -->
  <rect class="layer" x="60" y="416" width="840" height="112"/>
  <text class="lbl" x="78" y="440">业务与数据访问层</text>
  <rect class="box" x="80" y="456" width="390" height="56"/>
  <text class="t" x="275" y="485">控制器（业务逻辑、参数校验、事务处理）</text>
  <rect class="box" x="490" y="456" width="390" height="56"/>
  <text class="t" x="685" y="485">数据访问（mysql2 连接池、参数化查询）</text>

  <line class="ln" x1="480" y1="528" x2="480" y2="556"/>

  <!-- 数据层 -->
  <rect class="layer" x="60" y="558" width="840" height="122"/>
  <text class="lbl" x="78" y="582">数据层</text>
  <rect class="box" x="80" y="596" width="390" height="72"/>
  <text class="t" x="275" y="612">MySQL 8.0 数据库</text>
  <text class="t" x="275" y="634">user / walls / comments</text>
  <text class="t" x="275" y="656">message / feedbacks / label</text>
  <rect class="box" x="490" y="596" width="390" height="72"/>
  <text class="t" x="685" y="620">本地文件存储</text>
  <text class="t" x="685" y="644">上传图片目录 data / photo</text>
</svg>
</div>
</body>
</html>
